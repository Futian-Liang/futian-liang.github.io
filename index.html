<style>
  :root {

    --text: #e6edf3;
    --text-muted: #8b949e;
    --accent: #58a6ff;
    --accent-dim: #1f6feb;
    --green: #3fb950;

  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans SC', sans-serif;
    line-height: 1.6;
  }
  a { color: var(--accent); text-decoration: none; transition: color .2s; }
  a:hover { color: var(--purple); }

  /* Hero */
  .hero {
    text-align: center;
    padding: 80px 24px 60px;
    background: linear-gradient(180deg, #0d1117 0%, #161b22 100%);
    border-bottom: 1px solid var(--border);
  }
  .hero h1 {
    font-size: 2.8rem;
    font-weight: 700;
    margin-bottom: 12px;
    background: linear-gradient(135deg, var(--accent) 0%, var(--purple) 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p {
    color: var(--text-muted);
    font-size: 1.15rem;
    max-width: 600px;
    margin: 0 auto;
  }
  .hero-links {
    margin-top: 24px;
    display: flex;
    gap: 16px;
    justify-content: center;
  }
  .hero-links a {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    padding: 8px 20px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: .9rem;
    transition: all .2s;
  }
  .hero-links a:hover {
    border-color: var(--accent);
    background: rgba(88,166,255,.1);
  }

  /* Stats */
  .stats {
    display: flex;
    justify-content: center;
    gap: 48px;
    padding: 32px 24px;
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .stat-item { text-align: center; }
  .stat-item .num {
    font-size: 2rem;
    font-weight: 700;
    color: var(--accent);
  }
  .stat-item .label {
    font-size: .85rem;
    color: var(--text-muted);
    margin-top: 4px;
  }

  /* Container */
  .container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 48px 24px;
  }

  /* Section title */
  .section-title {
    font-size: 1.5rem;
    font-weight: 600;
    margin-bottom: 24px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title .count {
    font-size: .9rem;
    color: var(--text-muted);
    background: var(--bg-card);
    padding: 2px 10px;
    border-radius: 12px;
    border: 1px solid var(--border);
  }

  /* Filter */
  .filters {
    display: flex;
    gap: 8px;
    margin-bottom: 28px;
    flex-wrap: wrap;
  }
  .filter-btn {
    padding: 6px 16px;
    border: 1px solid var(--border);
    border-radius: 20px;
    background: transparent;
    color: var(--text-muted);
    cursor: pointer;
    font-size: .85rem;
    transition: all .2s;
  }
  .filter-btn:hover { border-color: var(--accent); color: var(--text); }
  .filter-btn.active {
    background: var(--accent-dim);
    border-color: var(--accent-dim);
    color: #fff;
  }

  /* Project grid */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(340px, 1fr));
    gap: 20px;
  }

  /* Project card */
  .card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 20px;
    transition: all .2s;
    display: flex;
    flex-direction: column;
  }
  .card:hover {
    border-color: var(--accent);
    background: var(--bg-hover);
    transform: translateY(-2px);
  }
  .card-header {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    margin-bottom: 10px;
  }
  .card-header h3 {
    font-size: 1.1rem;
    font-weight: 600;
  }
  .card-header h3 a { color: var(--text); }
  .card-header h3 a:hover { color: var(--accent); }
  .badges {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .badge {
    font-size: .7rem;
    padding: 2px 8px;
    border-radius: 12px;
    font-weight: 500;
    white-space: nowrap;
  }
  .badge-public { background: rgba(63,185,80,.15); color: var(--green); border: 1px solid rgba(63,185,80,.3); }
  .badge-private { background: rgba(248,81,73,.1); color: var(--red); border: 1px solid rgba(248,81,73,.25); }
  .badge-cat { background: rgba(188,140,255,.12); color: var(--purple); border: 1px solid rgba(188,140,255,.25); }
  .badge-local { background: rgba(210,153,34,.12); color: var(--orange); border: 1px solid rgba(210,153,34,.25); }

  .card-desc {
    color: var(--text-muted);
    font-size: .88rem;
    margin-bottom: 14px;
    flex-grow: 1;
    display: -webkit-box;
    -webkit-line-clamp: 3;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .card-footer {
    display: flex;
    align-items: center;
    justify-content: space-between;
    font-size: .78rem;
    color: var(--text-muted);
    border-top: 1px solid var(--border);
    padding-top: 12px;
    margin-top: auto;
  }
  .card-meta {
    display: flex;
    gap: 14px;
  }
  .card-meta span { display: inline-flex; align-items: center; gap: 4px; }
  .card-local {
    font-size: .75rem;
    color: var(--orange);
    margin-top: 6px;
    font-family: 'Cascadia Code', 'Fira Code', monospace;
  }

  /* Mapping table */
  .mapping-section { margin-top: 56px; }
  .table-wrap {
    overflow-x: auto;
    border: 1px solid var(--border);
    border-radius: 12px;
  }
  table {
    width: 100%;
    border-collapse: collapse;
    font-size: .85rem;
  }
  th, td {
    padding: 12px 16px;
    text-align: left;
    border-bottom: 1px solid var(--border);
  }
  th {
    background: var(--bg-card);
    color: var(--text-muted);
    font-weight: 500;
    font-size: .8rem;
    text-transform: uppercase;
    letter-spacing: .5px;
  }
  tr:last-child td { border-bottom: none; }
  tr:hover { background: var(--bg-card); }
  td code {
    font-family: 'Cascadia Code', 'Fira Code', monospace;
    font-size: .82rem;
    color: var(--orange);

  .status-dot {
    display: inline-block;
    width: 8px;
    height: 8px;
    border-radius: 50%;
    margin-right: 6px;
  }
  .dot-pub { background: var(--green); }
  .dot-pri { background: var(--red); }
  .dot-na { background: var(--text-muted); }

  /* Footer */

    text-align: center;
    padding: 40px 24px;
    border-top: 1px solid var(--border);
    color: var(--text-muted);
    font-size: .85rem;
  }
  footer a { color: var(--text-muted); }
  footer a:hover { color: var(--accent); }

  @media (max-width: 768px) {
    .hero h1 { font-size: 2rem; }
    .stats { gap: 24px; }
    .grid { grid-template-columns: 1fr; }
  }
</style>

// === Rendering ===
const grid = document.getElementById('project-grid');
const mappingBody = document.getElementById('mapping-body');

function formatDate(d) {
  if (d === '—') return '—';
  return d;
}

function renderProjects(filter) {
  grid.innerHTML = '';
  const filtered = filter === 'all' ? projects : projects.filter(p => p.cat === filter);
  filtered.forEach(p => {
    const card = document.createElement('div');
    card.className = 'card';
    const badges = `
      <span class="badge ${p.isPublic ? 'badge-public' : 'badge-private'}">${p.isPublic ? '公开' : '私有'}</span>
      <span class="badge badge-cat">${p.catLabel}</span>
    `;
    const localInfo = p.local
      ? `<div class="card-local">📁 ${p.local}</div>`
      : '';
    card.innerHTML = `
      <div class="card-header">
        <h3><a href="${p.url}" target="_blank">${p.name}</a></h3>
        <div class="badges">${badges}</div>
      </div>
      <div class="card-desc">${p.desc}</div>
      ${localInfo}
      <div class="card-footer">
        <div class="card-meta">
          <span>🔧 ${p.tech}</span>
        </div>
        <span>📅 ${formatDate(p.updated)}</span>
      </div>
    `;
    grid.appendChild(card);
  });
  document.getElementById('proj-count').textContent = filtered.length;
}

function renderMapping() {
  mappingBody.innerHTML = '';
  // Projects with local mapping
  projects.filter(p => p.local).forEach(p => {
    const tr = document.createElement('tr');
    const dotClass = p.isPublic ? 'dot-pub' : 'dot-pri';
    const visLabel = p.isPublic ? '公开' : '私有';
    tr.innerHTML = `
      <td><code>${p.local}</code></td>
      <td><a href="${p.url}" target="_blank">${p.name}</a></td>
      <td><span class="status-dot ${dotClass}"></span>${visLabel}</td>
      <td>${p.desc.substring(0, 60)}${p.desc.length > 60 ? '...' : ''}</td>
      <td>${formatDate(p.updated)}</td>
    `;
    mappingBody.appendChild(tr);
  });
  // Local-only dirs (no remote)
  localOnlyDirs.forEach(d => {
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td><code>${d.dir}</code></td>
      <td style="color:var(--text-muted)">— 无远程 —</td>
      <td><span class="status-dot dot-na"></span>仅本地</td>
      <td style="color:var(--text-muted)">${d.note}</td>
      <td>—</td>
    `;
    mappingBody.appendChild(tr);
  });
  document.getElementById('map-count').textContent = projects.filter(p => p.local).length + localOnlyDirs.length;
}

function renderStats() {
  const pub = projects.filter(p => p.isPublic).length;
  const pri = projects.filter(p => !p.isPublic).length;
  const local = projects.filter(p => p.local).length + localOnlyDirs.length;
  document.getElementById('stat-pub').textContent = pub;
  document.getElementById('stat-pri').textContent = pri;
  document.getElementById('stat-local').textContent = local;
  document.getElementById('stat-total').textContent = pub + pri;
}

// Filters
document.querySelectorAll('.filter-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProjects(btn.dataset.filter);
  });
});

renderProjects('all');
renderMapping();
renderStats();
